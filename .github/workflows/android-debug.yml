name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle y validar wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Compilar, probar y analizar
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Preparar APK y checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/nyaa-neo-debug.apk
          cd dist
          sha256sum nyaa-neo-debug.apk > nyaa-neo-debug.apk.sha256
      - name: Publicar APK descargable
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: nyaa-neo-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
      - name: Enlace de descarga
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo "### Nyaa Neo · APK de depuración" >> "$GITHUB_STEP_SUMMARY"
          echo "[Descargar artefacto con APK y SHA-256]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Extrae el ZIP e instala nyaa-neo-debug.apk desde tu tablet." >> "$GITHUB_STEP_SUMMARY"
